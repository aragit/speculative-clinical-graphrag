name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: speculative123
  QDRANT_HOST: http://localhost:6333
  OPA_URL: http://localhost:8181
  REDIS_URL: redis://localhost:6379

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/speculative123
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p speculative123 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 40s

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -sf http://localhost:6333/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
          --health-start-period 5s

      opa:
        image: openpolicyagent/opa:latest
        ports:
          - 8181:8181
        options: >-
          --health-cmd "curl -sf http://localhost:8181/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Seed Neo4j mock ontology
        run: |
          python -c "
          from core.verification_layer import Neo4jVerifier
          v = Neo4jVerifier()
          v.seed_mock_ontology()
          v.close()
          print('Ontology seeded')
          "

      - name: Run full test suite
        run: pytest tests/ -v --tb=short --ignore=tests/test_hybrid_rag.py

      - name: Run hybrid RAG tests (if infrastructure available)
        run: pytest tests/test_hybrid_rag.py -v --tb=short || echo "Hybrid RAG tests skipped (stub)"
