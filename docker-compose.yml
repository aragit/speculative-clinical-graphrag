version: "3.8"
services:
  neo4j:
    image: neo4j:5.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/speculative123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p speculative123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    volumes:
      - ./infra/opa/policies:/policies
    command: ["run", "--server", "--watch", "/policies"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "6831:6831/udp"
    profiles: ["tracing"]

  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    runtime: nvidia
    environment:
      - MODEL_NAME=deepseek-ai/deepseek-r1-distill-qwen-32b
      - MAX_MODEL_LEN=4096
      - TENSOR_PARALLEL_SIZE=2
      - GPU_MEMORY_UTILIZATION=0.90
    command:
      - "--model"
      - "deepseek-ai/deepseek-r1-distill-qwen-32b"
      - "--tensor-parallel-size"
      - "2"
      - "--max-model-len"
      - "4096"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--port"
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_HOST=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - OPA_URL=http://opa:8181
      - JAEGER_HOST=jaeger:6831
      - VLLM_URL=http://vllm:8000/v1
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy

volumes:
  neo4j_data:
  qdrant_data:
